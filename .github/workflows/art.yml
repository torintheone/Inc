# Иллюстрации: когда в art/incoming/ загружают картинки из Grok, приводит их к стилю игры
# (tools/process_art.py) и коммитит результат в assets/art/ той же ветки. Новый коммит
# запускает обычную сборку, и картинки появляются в игре.
name: Иллюстрации

on:
  workflow_dispatch:
  push:
    paths:
      - art/incoming/**
      - tools/process_art.py
      - .github/workflows/art.yml

permissions:
  contents: write

concurrency:
  group: art-${{ github.ref }}
  cancel-in-progress: false

jobs:
  process-art:
    runs-on: ubuntu-24.04
    if: github.ref_type == 'branch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Зависимости
        run: pip install numpy==2.5.3 pillow==12.3.0

      - name: Самопроверка
        run: python3 tools/process_art.py --self-test

      - name: Обработка картинок
        run: python3 tools/process_art.py

      - name: Коммит результата
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/art
          if git diff --cached --quiet; then
            echo "Новых картинок нет."
          else
            git commit -m "Обработать иллюстрации (tools/process_art.py)"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
