# Собирает данные мира (tools/build_world.py) и коммитит результат в ту же ветку.
# Запускается вручную или при изменении скрипта. Игре интернет не нужен: она берёт
# готовые data/world.json и data/world_shapes.json из репозитория.
name: Данные мира

on:
  workflow_dispatch:
    inputs:
      refresh:
        description: "Перекачать показатели Всемирного банка заново"
        type: boolean
        default: false
  push:
    paths:
      - tools/build_world.py
      - .github/workflows/world-data.yml

permissions:
  contents: write

concurrency:
  group: world-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-world:
    runs-on: ubuntu-24.04
    if: github.ref_type == 'branch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Зависимости
        run: pip install -r tools/requirements.txt

      - name: Сборка данных
        run: |
          if [ "${{ inputs.refresh }}" = "true" ]; then
            python3 tools/build_world.py --refresh
          else
            python3 tools/build_world.py
          fi

      - name: Коммит результата
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/world.json data/world_shapes.json tools/cache/worldbank.json
          if git diff --cached --quiet; then
            echo "Данные не изменились."
          else
            git commit -m "Обновить данные мира (tools/build_world.py)"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
